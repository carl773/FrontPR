name: 'FrontPR Scanner'
description: 'Scans a URL for accessibility issues using Playwright and axe-core'

inputs:
  target_url:
    description: 'The URL to scan'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ${{ github.workspace }}/scanner/package-lock.json

    - name: Install scanner dependencies
      shell: bash
      working-directory: ${{ github.workspace }}/scanner
      run: npm ci

    - name: Install Playwright browsers
      shell: bash
      working-directory: ${{ github.workspace }}/scanner
      run: npx playwright install --with-deps chromium

    - name: Run scanner
      shell: bash
      working-directory: ${{ github.workspace }}/scanner
      env:
        TARGET_URL: ${{ inputs.target_url }}
      run: npm run scan -- --url "$TARGET_URL"

    - name: Post PR comment
      if: ${{ github.event_name == 'pull_request' }}
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        OUTPUT_FILE: ${{ github.workspace }}/scanner/scanner-output.json
      run: |
        TARGET=$(jq -r '.targetUrl' "$OUTPUT_FILE")
        COUNT=$(jq -r '.findings | length' "$OUTPUT_FILE")

        if [ "$COUNT" -eq 0 ]; then
          BODY="## ✅ FrontPR Accessibility Scan

**Target:** $TARGET

No accessibility issues found. All clear!"
        else
          ROWS=$(jq -r '
            .findings[:10][] |
            "| " + (
              if .severity == "critical" then "🔴 Critical"
              elif .severity == "serious" then "🟠 Serious"
              elif .severity == "moderate" then "🟡 Moderate"
              else "🔵 Minor"
              end
            ) + " | `" + .ruleId + "` | " + .description + " |"
          ' "$OUTPUT_FILE")

          if [ "$COUNT" -gt 10 ]; then
            EXTRA="
> Showing 10 of $COUNT issues."
          else
            EXTRA=""
          fi

          BODY="## ⚠️ FrontPR Accessibility Scan

**Target:** $TARGET
**Issues found:** $COUNT

| Severity | Rule | What to fix |
|---|---|---|
$ROWS
$EXTRA

---
*Powered by [FrontPR](https://github.com/$REPO)*"
        fi

        curl -s -X POST \
          -H "Authorization: Bearer $GH_TOKEN" \
          -H "Content-Type: application/json" \
          "https://api.github.com/repos/$REPO/issues/$PR_NUMBER/comments" \
          -d "$(jq -n --arg body "$BODY" '{body: $body}')"
