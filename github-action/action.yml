name: 'FrontPR Scanner'
description: 'Scans for accessibility issues — static (eslint) + runtime (axe-core)'

inputs:
  target_url:
    description: 'URL to scan with axe-core (your production or live preview URL)'
    required: true
  api_key:
    description: 'Your FrontPR API key (store as a GitHub Secret)'
    required: true
  preview_url:
    description: 'Optional: manually specify a preview URL to scan instead of target_url'
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Mask API key in logs
      shell: bash
      run: echo "::add-mask::${{ inputs.api_key }}"

    - name: Install scanner dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../scanner
      run: npm ci

    - name: Install Playwright browsers
      shell: bash
      working-directory: ${{ github.action_path }}/../scanner
      run: npx playwright install --with-deps chromium

    - name: Run static a11y lint (eslint + jsx-a11y)
      shell: bash
      working-directory: ${{ github.action_path }}/../scanner
      run: npm run lint-a11y -- "${{ github.workspace }}"

    # Posts lint results to PR immediately (~15s from job start)
    # Runtime section will show "Scanning…" until axe-core finishes
    - name: Post lint results
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        FRONTPR_DASHBOARD_URL: 'https://www.frontprdev.com/dashboard'
      run: |
        bash "${{ github.action_path }}/post-comment.sh" \
          --lint-only \
          "${{ github.action_path }}/../scanner/lint-output.json"

    - name: Run runtime scanner (axe-core + Xano)
      shell: bash
      working-directory: ${{ github.action_path }}/../scanner
      env:
        FRONTPR_API_KEY: ${{ inputs.api_key }}
        FRONTPR_PREVIEW_URL: ${{ inputs.preview_url }}
        GITHUB_PR_NUMBER: ${{ github.event.pull_request.number }}
      run: npm run scan -- --url "${{ inputs.target_url }}"

    # Updates the PR comment with full results + dashboard link
    - name: Post full results
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
        COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        FRONTPR_DASHBOARD_URL: 'https://www.frontprdev.com/dashboard'
      run: |
        bash "${{ github.action_path }}/post-comment.sh" \
          "${{ github.action_path }}/../scanner/scanner-output.json" \
          "${{ github.action_path }}/../scanner/lint-output.json"

    - name: Cleanup
      if: always()
      shell: bash
      run: |
        rm -f "${{ github.action_path }}/../scanner/scanner-output.json"
        rm -f "${{ github.action_path }}/../scanner/lint-output.json"
