name: 'FrontPR Scanner'
description: 'Scans a URL for accessibility issues using Playwright and axe-core'

inputs:
  target_url:
    description: 'The URL to scan'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        cache-dependency-path: ${{ github.workspace }}/scanner/package-lock.json

    - name: Install scanner dependencies
      shell: bash
      working-directory: ${{ github.workspace }}/scanner
      run: npm ci

    - name: Install Playwright browsers
      shell: bash
      working-directory: ${{ github.workspace }}/scanner
      run: npx playwright install --with-deps chromium

    - name: Run scanner
      shell: bash
      working-directory: ${{ github.workspace }}/scanner
      env:
        TARGET_URL: ${{ inputs.target_url }}
      run: npm run scan -- --url "$TARGET_URL"

    - name: Print findings summary
      shell: bash
      run: |
        jq -r '
          "Target:   " + .targetUrl,
          "Findings: " + (.findings | length | tostring),
          "",
          (.findings[:10][] |
            "[\(.severity | ascii_upcase)] \(.ruleId)",
            "  Title:  \(.title)",
            "  Desc:   \(.description)",
            "  Target: \(.filePath // "n/a")",
            ""
          )
        ' "${{ github.workspace }}/scanner/scanner-output.json"
