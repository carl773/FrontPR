name: 'FrontPR Scanner'
description: 'Scans a URL for accessibility issues using Playwright and axe-core'

inputs:
  target_url:
    description: 'The URL to scan'
    required: true

runs:
  using: 'composite'
  steps:
    - name: Set up Node.js 22
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    - name: Install scanner dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/../scanner
      run: npm ci

    - name: Install Playwright browsers
      shell: bash
      working-directory: ${{ github.action_path }}/../scanner
      run: npx playwright install --with-deps chromium

    - name: Run scanner
      shell: bash
      working-directory: ${{ github.action_path }}/../scanner
      env:
        TARGET_URL: ${{ inputs.target_url }}
      run: npm run scan -- --url "$TARGET_URL"

    - name: Post PR comment
      if: github.event_name == 'pull_request'
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO: ${{ github.repository }}
      run: |
        bash ${{ github.action_path }}/post-comment.sh \
          ${{ github.action_path }}/../scanner/scanner-output.json
