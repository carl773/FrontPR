name: FrontPR Scan

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - main

jobs:
  scan:
    name: Run Scanner
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: scanner/package-lock.json

      - name: Install scanner dependencies
        working-directory: scanner
        run: npm ci

      - name: Install Playwright browsers
        working-directory: scanner
        run: npx playwright install --with-deps chromium

      - name: Run scanner
        working-directory: scanner
        run: npm run scan -- --url https://example.com

      - name: Print scanner output
        run: cat scanner/scanner-output.json

      - name: POST scan results to backend
        env:
          BACKEND_URL: https://frontpr-api-dev-ocm.azurewebsites.net
        run: |
          response=$(curl -s -w "\n%{http_code}" \
            -X POST "${BACKEND_URL}/api/scans/ingest" \
            -H "Content-Type: application/json" \
            -d @scanner/scanner-output.json)

          http_code=$(echo "$response" | tail -1)
          body=$(echo "$response" | head -n -1)
          echo "HTTP Status: $http_code"
          echo "Response: $body"

          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            echo "Backend returned non-2xx status ($http_code) — failing step"
            exit 1
          fi
